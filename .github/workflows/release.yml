name: Release

on:
  push:
    branches: ["release/Ver_*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: ./scripts/check-invariants.sh
      - run: ./scripts/release-changelog.sh --check
      - run: ./scripts/test-release-changelog.sh
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release/Ver_}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::ブランチ '$GITHUB_REF_NAME' が release/Ver_X.Y.Z 形式ではありません"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Apply release version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Cut changelog section
        run: ./scripts/release-changelog.sh "${{ steps.version.outputs.version }}" "$(date -u +%F)"
      - name: Package VSIX
        run: npm run package
      - name: Check VSIX size and checksum
        run: |
          test "$(stat -c %s vsix/agent-tool.vsix)" -lt 20971520
          sha256sum vsix/agent-tool.vsix | tee vsix/agent-tool.vsix.sha256
      - name: Publish stable release to Open VSX
        if: ${{ !contains(steps.version.outputs.version, '-') && env.OVSX_PAT != '' }}
        run: npx --yes ovsx@1.2.0 publish vsix/agent-tool.vsix -p "$OVSX_PAT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "Ver_${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "Agent Tool ${{ steps.version.outputs.version }}" \
            --notes-file <(./scripts/release-changelog.sh --section "${{ steps.version.outputs.version }}") \
            vsix/agent-tool.vsix vsix/agent-tool.vsix.sha256
      - name: Sync version to main
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git switch -f -C main origin/main
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          ./scripts/release-changelog.sh "$RELEASE_VERSION" "$(date -u +%F)"
          git add package.json package-lock.json CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: Ver_${RELEASE_VERSION} の版と CHANGELOG を反映 [skip ci]"
          git push origin main
