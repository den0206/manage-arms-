name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
      - name: Select latest stable Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -1)"
          [ -n "$XCODE" ] || XCODE=/Applications/Xcode.app
          sudo xcode-select -s "$XCODE"
          swiftc --version
      - run: npm ci
      - run: swift build
      - run: swift test
      - run: ./scripts/check-invariants.sh
      - run: ./scripts/release-changelog.sh --check
      - run: ./scripts/test-release-changelog.sh
      - run: npm run package
      - run: npm run test:vsix
      - run: npm run test:cursor
      - name: Check VSIX size
        run: test "$(stat -f %z vsix/agent-tool.vsix)" -lt 20971520
