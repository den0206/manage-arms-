<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Agent Tool</title>
    <link rel="stylesheet" href="tab.css">
  </head>
  <body>
    <header>
      <h1 data-i18n="tabTitle"></h1>
      <button id="open-settings" class="icon" data-i18n-title="tabSettings" type="button">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
          <path fill="currentColor" d="M8 10.2a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4Zm5.6-1.4.9-.8-1.1-2-1.2.4a4.6 4.6 0 0 0-1-.6L10.9 4.5H8.7l-.3 1.3a4.6 4.6 0 0 0-1 .6l-1.2-.4-1.1 2 .9.8a4.7 4.7 0 0 0 0 1.2l-.9.8 1.1 2 1.2-.4c.3.2.7.4 1 .6l.3 1.3h2.2l.3-1.3c.4-.2.7-.4 1-.6l1.2.4 1.1-2-.9-.8a4.7 4.7 0 0 0 0-1.2Z"/>
        </svg>
      </button>
    </header>

    <main>
      <p id="done" class="done" hidden></p>

      <!-- 検知したとき。ここだけが主役になる。 -->
      <section id="found" hidden>
        <div class="card">
          <span id="found-kind" class="kind"></span>
          <h2 id="found-name"></h2>
          <code id="found-repo" class="repo"></code>

          <fieldset>
            <legend data-i18n="tabTargetLabel"></legend>
            <div id="targets"></div>
          </fieldset>

          <p id="status" class="status" role="status"></p>
          <div class="actions">
            <button id="install" class="primary" type="button" data-i18n="tabInstall"></button>
            <button id="dismiss" type="button" data-i18n="tabDismiss"></button>
          </div>
        </div>
      </section>

      <section id="url-section">
        <label for="url" data-i18n="tabUrlLabel"></label>
        <input id="url" type="url" autocomplete="off" spellcheck="false">
        <p id="url-error" class="error" hidden data-i18n="tabUrlUnsupported"></p>
      </section>

      <section id="collection-section">
        <div class="section-head">
          <h2 data-i18n="tabCollection"></h2>
          <button id="verify" type="button" hidden data-i18n="tabVerify"></button>
        </div>
        <ul id="collection"></ul>
        <p id="collection-empty" class="empty" data-i18n="tabCollectionEmpty"></p>
      </section>

      <section id="settings-section">
        <label class="switch">
          <input id="auto-open" type="checkbox">
          <span data-i18n="tabAutoOpenToggle"></span>
        </label>
      </section>
    </main>
    <script type="module" src="tab.js"></script>
  </body>
</html>
